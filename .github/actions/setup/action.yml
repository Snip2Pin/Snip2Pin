name: Build environment
description: Install desktop dependencies and the repository-pinned Rust toolchain
runs:
  using: composite
  steps:
    - name: Linux desktop dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev libfontconfig1-dev dpkg-dev
    - name: Pinned NSIS installer compiler
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./packaging/windows/install-nsis.ps1
    - name: Pinned toolchain
      shell: bash
      run: rustup show active-toolchain
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
    - name: Pinned license collector
      shell: bash
      run: cargo install cargo-about --version 0.9.2 --locked --features cli
