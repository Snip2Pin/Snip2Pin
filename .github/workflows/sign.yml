name: Sign release candidates (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable MAJOR.MINOR.PATCH already merged into main
        required: true
        type: string
      revision:
        description: Full source SHA matching the unsigned candidates
        required: true
        type: string
      candidate_run:
        description: Successful manual candidates workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select trusted source and committed release notes
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          git checkout --detach "$REVISION"
          test -s "docs/releases/$VERSION.md"
      - uses: ./.github/actions/setup
      - name: Fresh dependency audit
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          arguments: --locked
      - name: Verify exact source, CI and all original candidate hashes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: cargo xtask candidate-check "$VERSION" "$REVISION" "$CANDIDATE_RUN"
  sign:
    needs: validate
    environment: release
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: candidate-${{ matrix.target }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: dist/candidate
      - name: Check target, source, version and candidate hash before credentials
        run: cargo xtask verify-candidate dist/candidate ${{ matrix.target }}
      - name: macOS Developer ID signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_CERTIFICATE_SHA1: ${{ vars.MACOS_CERTIFICATE_SHA1 }}
        run: bash packaging/macos/ci-sign.sh dist/candidate dist/final
      - name: Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./packaging/windows/ci-sign.ps1 -Candidate dist/candidate -OutputDirectory dist/final
      - name: Finalize Linux archive without platform signing
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/final
          cp "dist/candidate/Snip2Pin-$VERSION-x86_64-unknown-linux-gnu-unsigned.tar.gz" "dist/final/Snip2Pin-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          cargo xtask finalize dist/candidate "dist/final/Snip2Pin-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
      - name: Verify final files on the native platform
        run: cargo xtask verify-native dist/final ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-${{ matrix.target }}
          path: dist/final/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: signed-*
          merge-multiple: true
          path: dist/final
      - name: Create a draft with the verified files; do not publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: cargo xtask stage "$VERSION" "$REVISION" dist/final "docs/releases/$VERSION.md" --confirm
