name: PR and commit conventions
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: messages-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  messages:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check PR title and all branch commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask check-messages "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE"
