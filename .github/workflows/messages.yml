name: PR and commit conventions
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number; select its source branch so checks bind to its exact head
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: messages-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  messages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check PR title and all branch commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask check-messages "$BASE_SHA" "$HEAD_SHA" "$PR_TITLE"
      - name: Revalidate actual PR metadata on its exact source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: cargo xtask check-pr "$PR_NUMBER"
