name: Cross-platform CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate pre-commit configuration and text metadata
        run: |
          python -m pip install pre-commit==4.7.0
          pre-commit validate-config
          pre-commit run check-yaml --all-files
          pre-commit run check-toml --all-files
          pre-commit run check-added-large-files --all-files
          pre-commit run check-merge-conflict --all-files
          pre-commit run end-of-file-fixer --all-files
          pre-commit run trailing-whitespace --all-files
      - name: Validate workflow syntax and shell expressions
        shell: bash
        run: |
          curl --fail --location --output /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
  check:
    name: check (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Repository checks
        run: cargo xtask check
      - name: Package structure and CLI smoke check (no credentials/upload)
        run: cargo xtask package ${{ matrix.target }} debug
      - name: macOS packaging storage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          df -h .
          du -sh target .build
      - name: Check unverified package integrity without credentials or upload
        shell: bash
        run: |
          cargo xtask prepare-unverified .build/packages/debug/${{ matrix.target }} .build/unverified-final/${{ matrix.target }} ${{ matrix.target }}
          cargo xtask verify-native .build/unverified-final/${{ matrix.target }} ${{ matrix.target }} unverified
      - name: Minimum supported Rust
        run: cargo xtask check-msrv
      - name: Windows installer fixture and uninstall checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/tests.ps1
      - name: Debian package fixture and payload checks
        if: runner.os == 'Linux'
        run: cargo test --locked -p xtask debian_fixture -- --ignored
      - name: Debian install and removal on a clean Ubuntu baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --env DEBIAN_FRONTEND=noninteractive --volume "$PWD/.build/unverified-final/${{ matrix.target }}:/packages:ro" \
            ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            bash -eu -c 'apt-get update; apt-get install --yes /packages/*.deb; snip2pin --version; apt-get install --yes --reinstall /packages/*.deb; snip2pin --version; apt-get remove --yes snip2pin; ! command -v snip2pin'
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --locked
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check shared Rust UI for WebAssembly (no desktop or system services)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --locked --package snip2pin-preview --target wasm32-unknown-unknown -- -D warnings
