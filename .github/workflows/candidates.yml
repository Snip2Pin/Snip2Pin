name: Build release candidates (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable MAJOR.MINOR.PATCH, already merged into main
        required: true
        type: string
      revision:
        description: Full source SHA already contained in main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidates-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the trusted source commit
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          git checkout --detach "$REVISION"
      - uses: ./.github/actions/setup
        with:
          desktop: 'false'
      - name: Fresh dependency audit for the selected source
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --locked
      - name: Exact commit and successful CI
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release-check "$VERSION" "$REVISION"
  build:
    needs: validate
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build unsigned candidate
        run: cargo xtask package ${{ matrix.target }} release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: |
            .build/packages/release/${{ matrix.target }}/*.zip
            .build/packages/release/${{ matrix.target }}/*.tar.gz
            .build/packages/release/${{ matrix.target }}/*.json
          if-no-files-found: error
          retention-days: 14
