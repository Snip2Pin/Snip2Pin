[package]
name = "snip2pin"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A tiny cross-platform screenshot pinning app"
repository = "https://github.com/rensilin/snip2pin"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = { version = "0.9.8", default-features = false }
directories = "6.0"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
x11rb = "0.13.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
name = "macos_overlay"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
