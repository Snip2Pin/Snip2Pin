[package]
name = "snip2pin"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A tiny cross-platform screenshot pinning app"
repository = "https://github.com/Snip2Pin/Snip2Pin"
license = "MIT"
publish = false

[workspace]
members = ["xtask", "preview"]
default-members = ["."]
resolver = "3"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
global-hotkey = "0.8.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
sys-locale = { version = "0.3.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
raw-window-handle = "0.6"
xcap = { version = "0.9.8", default-features = false }
directories = "6.0"
tempfile = "3.27"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }
objc2-core-graphics = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSScreen", "NSAppearance", "NSWorkspace", "NSRunningApplication", "NSCursor", "NSEvent", "NSNib", "NSMenu", "NSMenuItem", "NSAlert", "NSButton", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSUserDefaults", "NSData", "NSBundle", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
plist = "1.8"

[target.'cfg(target_os = "macos")'.dev-dependencies]
egui-winit = { version = "0.36.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
x11rb = "0.14.0"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.100"
windows-result = "0.100"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"

[[test]]
name = "macos_overlay"
harness = false

[[test]]
name = "macos_lifecycle"
harness = false

[[test]]
name = "macos_icons"
harness = false

[[test]]
name = "macos_dock"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
