[advisories]
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0", "CC0-1.0", "Unlicense", "MPL-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/emilk/egui"]
