<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snip2Pin · Interactive demo</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf1; }
canvas { width: 100%; height: 100%; display: block; }
#status { position: absolute; left: 20px; right: 20px; top: 20px; font: 14px system-ui; }
#licenses { position: fixed; right: 12px; bottom: 8px; padding: 4px 8px; border-radius: 4px; background: #ffffffeb; font: 12px system-ui; }
#licenses a { color: #35435c; }
@media (prefers-color-scheme: dark) {
  html, body { background: #191b20; color: #e8edf5; }
  #licenses { background: #20232beb; }
  #licenses a { color: #d6e0f0; }
}
</style>
<div id="status">正在加载交互演示… / Loading interactive demo…</div>
<canvas id="canvas"></canvas>
<!-- SITE_NOTICES -->
<script type="module">
import init, { start } from './pkg/snip2pin_preview.js';
try {
  const [, font, wallpaper] = await Promise.all([
    init(),
    fetch('./pkg/font.ttf').then(response => {
      if (!response.ok) throw new Error('Font unavailable');
      return response.arrayBuffer();
    }),
    fetch('./assets/wallpaper.webp').then(response => {
      if (!response.ok) throw new Error('Wallpaper unavailable');
      return response.blob();
    }).then(createImageBitmap),
  ]);
  // Browser-native decoding keeps the preview asset/decoder out of native builds.
  const surface = document.createElement('canvas');
  surface.width = wallpaper.width;
  surface.height = wallpaper.height;
  const context = surface.getContext('2d', { willReadFrequently: true });
  context.drawImage(wallpaper, 0, 0);
  const pixels = context.getImageData(0, 0, surface.width, surface.height);
  wallpaper.close();
  await start(
    new Uint8Array(font),
    new Uint8Array(pixels.data.buffer), surface.width, surface.height,
  );
  document.querySelector('#status').remove();
} catch (error) {
  document.querySelector('#status').textContent = `加载失败：${error}`;
}
</script>
</html>
