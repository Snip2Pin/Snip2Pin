<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snip2Pin · UI sandbox</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf1; }
canvas { width: 100%; height: 100%; display: block; }
#status { position: absolute; left: 20px; top: 20px; font: 14px system-ui; }
</style>
<div id="status">正在加载 Snip2Pin 沙箱…</div>
<canvas id="canvas"></canvas>
<script type="module">
import init, { start } from './pkg/snip2pin_preview.js';
try {
  await init();
  const font = await fetch('./pkg/font.ttf');
  await start(font.ok ? new Uint8Array(await font.arrayBuffer()) : new Uint8Array());
  document.querySelector('#status').remove();
} catch (error) {
  document.querySelector('#status').textContent = `加载失败：${error}`;
}
</script>
</html>
