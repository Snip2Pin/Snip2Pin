[package]
name = "snip2pin-preview"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snip2pin = { path = ".." }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[lints.rust]
unsafe_code = "deny"
