[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
